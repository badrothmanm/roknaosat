{% extends "admin/change_form.html" %}
{% load i18n admin_urls static %}

{% block extrahead %}
{{ block.super }}
<style>
    /* Premium QR Modal */
    #qr-modal-overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(7, 16, 28, 0.85);
        -webkit-backdrop-filter: blur(8px);
        backdrop-filter: blur(8px);
        z-index: 9999;
        align-items: center;
        justify-content: center;
        padding: 20px;
    }
    #qr-modal {
        background: #0d1b2e;
        border: 1px solid #D4AF37;
        border-radius: 24px;
        width: 100%;
        max-width: 450px;
        padding: 30px;
        box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        position: relative;
    }
    #qr-modal h3 { color: #D4AF37; margin-top: 0; margin-bottom: 20px; font-weight: 800; text-align: center; }
    .qr-input-group { margin-bottom: 15px; }
    .qr-input-group label { display: block; color: #fff; margin-bottom: 8px; font-weight: 600; font-size: 0.9rem; }
    .qr-input-group input { 
        width: 100%; background: rgba(255,255,255,0.05); border: 1px solid rgba(212,175,55,0.3); 
        color: #fff; padding: 12px 16px; border-radius: 12px; font-family: inherit;
    }
    .qr-modal-actions { display: flex; gap: 12px; margin-top: 25px; }
    .btn-qr-generate { 
        flex: 2; background: #D4AF37; color: #07101c; border: none; padding: 12px; 
        border-radius: 12px; font-weight: 800; cursor: pointer; transition: all 0.2s;
    }
    .btn-qr-cancel { 
        flex: 1; background: transparent; color: #fff; border: 1px solid rgba(255,255,255,0.2); 
        padding: 12px; border-radius: 12px; cursor: pointer;
    }
    .qr-trigger-btn {
        background: transparent !important;
        border: 1px solid #D4AF37 !important;
        color: #D4AF37 !important;
        padding: 4px 12px !important;
        border-radius: 6px !important;
        font-weight: 700 !important;
        cursor: pointer !important;
        margin-right: 10px !important;
        transition: all 0.2s !important;
    }
    .qr-trigger-btn:hover { background: rgba(212,175,55,0.1) !important; }
</style>
{% endblock %}

{% block object-tools-items %}
    {{ block.super }}
{% endblock %}

{% block content %}
{{ block.super }}

<script>
    document.addEventListener('DOMContentLoaded', function() {
        {% if object_id %}
        // Find the tab bar (usually .nav-tabs or similar in Jazzmin)
        const tabContainer = document.querySelector('.nav.nav-tabs');
        if (tabContainer) {
            // Create the new tab item
            const qrTabLi = document.createElement('li');
            qrTabLi.className = 'nav-item';
            
            const qrTabA = document.createElement('a');
            qrTabA.className = 'nav-link';
            qrTabA.href = '#';
            qrTabA.innerHTML = '<i class="fas fa-qrcode mr-1"></i> طباعة البطاقة';
            qrTabA.style.border = '1px solid #D4AF37';
            qrTabA.style.marginRight = '5px';
            qrTabA.style.borderRadius = '4px';

            qrTabA.onclick = function(e) {
                e.preventDefault();
                const baseUrl = '{% url "listings:property_qr" object_id %}';
                // Pull values from the DOM fields
                const valInput = document.querySelector('[name="val_license"]');
                const adInput = document.querySelector('[name="ad_number"]');
                const val = valInput ? valInput.value.trim() : '';
                const ad = adInput ? adInput.value.trim() : '';
                
                const finalUrl = `${baseUrl}?val=${encodeURIComponent(val)}&ad=${encodeURIComponent(ad)}`;
                window.open(finalUrl, '_blank');
            };

            qrTabLi.appendChild(qrTabA);
            tabContainer.appendChild(qrTabLi);
        }
        {% endif %}
    });
</script>
{% endblock %}
